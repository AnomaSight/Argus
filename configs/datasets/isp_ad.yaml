# ISP-AD: modalities and split sizes (task 0.4), copying Deng (arXiv:2608.15090, Table 1).
# Rationale: docs/experiment_protocol.md. Split roles: contract C1 in docs/architecture.md.

dataset: isp_ad
root: isp_ad # under ARGUS_DATA_DIR, laid out by A1.1
source: public unsupervised split, Zenodo record 14911043 (unsupervised.zip)
preprocess: deng # resize to 256 x 256, no crop
seeds: [20260801, 20260802, 20260803] # Deng's seeds

categories:
  # Keys are the archive's modality folder names (LSM_2 is "LSM-2" in Deng and in prose);
  # A1.1 extracts each one to data/isp_ad/{key}/.
  LSM_2:
    # Counted by A1.1 from unsupervised.zip v1.0. Deng's Table 1 "point / all" column is
    # really points / area ("all" = the area folder count), so total defects = points + area.
    expected_counts:
      train_good: 401
      test_good: 382
      point_defects: 33
      area_defects: 63
    # Drawn per seed from train/good + test/good pooled (C1; LSM_2 has only 401 train goods).
    # `test` holds every defect and no goods. Pooled goods not drawn in a seed are unused.
    split:
      support: 300
      calib: 150
      eval_normal: 200

  LSM_1:
    expected_counts:
      train_good: 3678 # train/good_reduced (500 duplicates of these) is not extracted
      test_good: 1470
      point_defects: 46
      area_defects: 49
    split:
      support: 300
      calib: 150
      eval_normal: 200

  ASM:
    expected_counts:
      train_good: 500
      test_good: 1916
      point_defects: 41
      area_defects: 33
    split:
      support: 300
      calib: 150
      eval_normal: 200
