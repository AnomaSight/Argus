# Runs only the checks that the changed files can affect.
# Docs/planning-only changes run nothing except the `changes` and `ci-ok` jobs.
# Branch protection should require just `ci-ok`: it passes when every needed
# job passed or was skipped, and fails if any of them failed or was cancelled.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read # paths-filter lists PR files through the API

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lint: ${{ steps.filter.outputs.lint }}
      tests: ${{ steps.filter.outputs.tests }}
      shell: ${{ steps.filter.outputs.shell }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            workflow: &workflow
              - .github/workflows/ci.yml
            lint:
              - *workflow
              - '**/*.py'
              - pyproject.toml
              - Makefile
            tests:
              - *workflow
              - 'src/**'
              - 'tests/**'
              - 'backend/**'
              - 'configs/**'
              - pyproject.toml
              - Makefile
            shell:
              - *workflow
              - '**/*.sh'
            frontend:
              - *workflow
              - 'frontend/**'

  lint:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # Only ruff is needed; take its version range from pyproject.toml so CI
      # and laptops always use the same formatter.
      - name: Install ruff
        run: |
          ruff_req=$(python -c "import tomllib; d = tomllib.load(open('pyproject.toml', 'rb')); print(next(r for r in d['project']['optional-dependencies']['dev'] if r.startswith('ruff')))")
          python -m pip install "$ruff_req"
      - run: make lint

  tests:
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      # CPU-only torch: ~200 MB instead of several GB of CUDA wheels.
      # Tests must not need a GPU.
      - name: Install CPU torch
        run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: make install
      - run: make test

  shell:
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # shellcheck is preinstalled on ubuntu runners. Empty files are skipped.
      - name: shellcheck
        run: |
          files=$(git ls-files '*.sh' | while read -r f; do [ -s "$f" ] && echo "$f"; done)
          if [ -z "$files" ]; then echo "No non-empty shell scripts."; exit 0; fi
          echo "$files" | xargs shellcheck

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      # Skips cleanly until the frontend is scaffolded (0.2) with a lockfile.
      - name: Check for lockfile
        id: lock
        run: |
          if [ -f package-lock.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "No frontend/package-lock.json yet, skipping."; fi
      - uses: actions/setup-node@v7
        if: steps.lock.outputs.present == 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: steps.lock.outputs.present == 'true'
        run: npm ci
      - if: steps.lock.outputs.present == 'true'
        run: npm run lint --if-present
      - if: steps.lock.outputs.present == 'true'
        run: npm run build --if-present
      - if: steps.lock.outputs.present == 'true'
        run: npm test --if-present

  ci-ok:
    needs: [changes, lint, tests, shell, frontend]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: All required checks passed or were skipped
        run: |
          echo '${{ toJSON(needs) }}'
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then
            echo "A required job failed or was cancelled."
            exit 1
          fi
