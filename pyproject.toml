[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "argus"
version = "0.1.0"
description = "PatchCore memory size vs calibrated false-positive rate for industrial anomaly detection"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Arvind Kaushik" }, { name = "Pratyush Garg" }]
# Lower bounds only for torch/torchvision so Colab keeps its preinstalled CUDA build.
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyarrow>=14",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
    "opencv-python-headless>=4.8",
    "pillow>=10.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.17,<0.18",  # minor pinned: format output changes between minors
]

[project.scripts]
argus = "argus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["frontend", "notebooks", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["argus"]
